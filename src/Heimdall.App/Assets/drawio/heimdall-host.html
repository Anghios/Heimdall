<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'; child-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"/>
    <style>
        :root {
            --menu-border: #4c5168;
            --menu-background: #20232d;
            --menu-hover: #2e3342;
            --menu-separator: #3a4053;
            --menu-text: #f4f5f8;
            --menu-text-disabled: #80879c;
            --menu-shortcut: #9ea5bd;
            --menu-shadow: rgba(0, 0, 0, 0.45);
        }
        body.theme-light {
            --menu-border: #c9cdd8;
            --menu-background: #ffffff;
            --menu-hover: #eef0f5;
            --menu-separator: #e1e4ec;
            --menu-text: #1f2330;
            --menu-text-disabled: #9aa0b2;
            --menu-shortcut: #6c7389;
            --menu-shadow: rgba(0, 0, 0, 0.18);
        }
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .heimdall-context-menu {
            position: fixed;
            z-index: 2147483647;
            min-width: 220px;
            padding: 6px 0;
            border: 1px solid var(--menu-border);
            border-radius: 8px;
            background: var(--menu-background);
            box-shadow: 0 12px 32px var(--menu-shadow);
            display: none;
            font: 13px/1.2 "Segoe UI", sans-serif;
            color: var(--menu-text);
        }
        .heimdall-context-menu button {
            width: 100%;
            padding: 8px 12px;
            border: 0;
            background: transparent;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            text-align: left;
            cursor: pointer;
        }
        .heimdall-context-menu button:hover:not(:disabled) {
            background: var(--menu-hover);
        }
        .heimdall-context-menu button:disabled {
            color: var(--menu-text-disabled);
            cursor: default;
        }
        .heimdall-context-menu hr {
            height: 1px;
            border: 0;
            margin: 6px 0;
            background: var(--menu-separator);
        }
        .heimdall-context-menu .shortcut {
            color: var(--menu-shortcut);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <iframe id="drawio-frame" allow="clipboard-read; clipboard-write"></iframe>
    <div id="heimdall-context-menu" class="heimdall-context-menu"></div>
    <script>
        // Host page for the embedded draw.io editor.
        //
        // The WPF side (DiagramEditorView) talks to this page through WebView2
        // string messages; this page talks to draw.io through the embed
        // protocol (postMessage, proto=json). Every message is a string
        // "<verb>:<payload>" so the C# side never parses JSON for routing.
        //
        // Host -> page:   load:<xml> | export-png: | export-svg: | export-xml: | command:<action>
        // Page -> host:   ready: | editor-ready: | save:<xml> (autosave) | save-request:<xml> (Ctrl+S)
        //                 export:<data uri or svg> | export-xml:<xml> | open-link:<json> | exit:
        //
        // The page is opened as heimdall-host.html?lang=<en|fr>&theme=<dark|light>;
        // both values are forwarded to draw.io so the editor follows Heimdall's
        // own locale and theme instead of the operating system's.
        var hostParams = new URLSearchParams(window.location.search);
        var editorLanguage = hostParams.get('lang') || 'en';
        var editorTheme = hostParams.get('theme') === 'light' ? 'light' : 'dark';
        var editorOrigin = window.location.origin;

        var currentXml = null;
        var frame = document.getElementById('drawio-frame');
        var contextMenu = document.getElementById('heimdall-context-menu');
        var editorReady = false;
        var chromeConfigured = false;
        var contextMenuBound = false;
        var contextMenuVisible = false;
        // Labels for the entries Heimdall adds, sent by the host after 'ready:'.
        // draw.io's own entries take their label from mxResources instead.
        var heimdallLabels = {};

        var contextMenuItems = [
            // Following a cell's link is not something draw.io's editing mode does
            // on any mouse gesture, so Heimdall gives the session its own entry.
            { heimdallAction: 'open-session', labelKey: 'openSession', fallbackLabel: 'Open session' },
            { separator: true },
            { action: 'undo', shortcut: 'Ctrl+Z' },
            { action: 'redo', shortcut: 'Ctrl+Y' },
            { separator: true },
            { action: 'cut', shortcut: 'Ctrl+X' },
            { action: 'copy', shortcut: 'Ctrl+C' },
            { action: 'paste', shortcut: 'Ctrl+V' },
            { separator: true },
            { action: 'duplicate', shortcut: 'Ctrl+D' },
            { action: 'delete', shortcut: 'Del' },
            { separator: true },
            { action: 'insertEdge' },
            { action: 'format', labelKey: 'formatPanel', fallbackLabel: 'Format' },
            { separator: true },
            { action: 'rounded' },
            { action: 'curved' },
            { action: 'clearWaypoints' }
        ];

        document.body.classList.add(editorTheme === 'light' ? 'theme-light' : 'theme-dark');

        function postToHost(message) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(message);
            }
        }

        function postToEditor(payload) {
            if (!frame.contentWindow) return;
            frame.contentWindow.postMessage(JSON.stringify(payload), editorOrigin);
        }

        function loadDiagram(xml) {
            postToEditor({ action: 'load', xml: xml || '', autosave: 1 });
        }

        function getDrawioApp() {
            try {
                return frame.contentWindow && frame.contentWindow.heimdallDrawioApp
                    ? frame.contentWindow.heimdallDrawioApp
                    : null;
            } catch (e) {
                return null;
            }
        }

        function configureEditorChrome(attempt) {
            if (chromeConfigured) {
                return true;
            }

            var app = getDrawioApp();
            if (!app) {
                if ((attempt || 0) < 20) {
                    setTimeout(function() {
                        configureEditorChrome((attempt || 0) + 1);
                    }, 50);
                }
                return false;
            }

            try {
                if (app.menubarContainer) {
                    app.menubarContainer.style.display = 'none';
                }

                if (app.toolbarContainer) {
                    app.toolbarContainer.style.display = 'none';
                }

                app.menubarHeight = 0;
                app.toolbarHeight = 0;

                if (typeof app.refresh === 'function') {
                    app.refresh();
                }

                // draw.io's own context menu would otherwise open on the same
                // right click and render over this one, swallowing the click that
                // was meant for it. Heimdall provides the menu, so this is off.
                if (app.editor && app.editor.graph && app.editor.graph.popupMenuHandler) {
                    app.editor.graph.popupMenuHandler.setEnabled(false);
                }

                ensureContextMenuBinding(0);
                chromeConfigured = true;
                return true;
            } catch (e) {
                if ((attempt || 0) < 20) {
                    setTimeout(function() {
                        configureEditorChrome((attempt || 0) + 1);
                    }, 50);
                }
                return false;
            }
        }

        function getDrawioAction(actionName) {
            var app = getDrawioApp();
            if (!app || !app.actions || typeof app.actions.get !== 'function') {
                return null;
            }

            try {
                return app.actions.get(actionName);
            } catch (e) {
                return null;
            }
        }

        function isDrawioActionEnabled(actionName) {
            var action = getDrawioAction(actionName);
            if (!action || typeof action.funct !== 'function') {
                return false;
            }

            try {
                return typeof action.isEnabled === 'function' ? action.isEnabled() : true;
            } catch (e) {
                return false;
            }
        }

        // The label draw.io itself would show for one of its actions.
        //
        // An action's `label` is its RESOURCE KEY, not its text: 'undo' carries
        // 'undo', and 'insertEdge' carries 'line'. draw.io translates it when it
        // builds its own menu. Returning it as the label put the key on screen,
        // so this menu read "undo / redo / cut" while draw.io's own read
        // "Annuler / Refaire / Couper".
        function getDrawioLabel(actionName, labelKey, fallbackLabel) {
            var action = getDrawioAction(actionName);
            var key = labelKey;

            if (!key && action && typeof action.label === 'string' && action.label.length > 0) {
                key = action.label;
            }

            if (!key) {
                key = actionName;
            }

            try {
                if (frame.contentWindow
                    && frame.contentWindow.mxResources
                    && typeof frame.contentWindow.mxResources.get === 'function') {
                    var label = frame.contentWindow.mxResources.get(key);
                    if (label) {
                        return label;
                    }
                }
            } catch (e) {
                // Ignore localization lookup failures
            }

            return fallbackLabel || key;
        }

        function executeDrawioAction(actionName, eventArg) {
            var action = getDrawioAction(actionName);
            if (!action || typeof action.funct !== 'function') {
                return false;
            }

            if (!isDrawioActionEnabled(actionName)) {
                return false;
            }

            try {
                action.funct(eventArg);
                return true;
            } catch (e) {
                return false;
            }
        }

        function focusDrawio() {
            var app = getDrawioApp();

            try {
                if (app && app.editor && app.editor.graph && app.editor.graph.container) {
                    app.editor.graph.container.focus();
                } else if (frame.contentWindow && typeof frame.contentWindow.focus === 'function') {
                    frame.contentWindow.focus();
                }
            } catch (e) {
                // Ignore focus errors
            }
        }

        function hideContextMenu() {
            if (!contextMenuVisible) {
                return;
            }

            contextMenu.style.display = 'none';
            frame.style.pointerEvents = '';
            contextMenuVisible = false;
        }

        // Reads the Heimdall link carried by the one selected cell, if any.
        // Anything else, including a web link, is left to draw.io.
        function getSelectedSessionLink() {
            var app = getDrawioApp();
            if (!app || !app.editor || !app.editor.graph) {
                return null;
            }

            try {
                var graph = app.editor.graph;
                var cells = graph.getSelectionCells();
                if (!cells || cells.length !== 1) {
                    return null;
                }

                var link = graph.getLinkForCell(cells[0]);
                return link && link.indexOf('heimdall://') === 0 ? link : null;
            } catch (e) {
                return null;
            }
        }

        function executeHeimdallAction(name) {
            if (name !== 'open-session') {
                return false;
            }

            var link = getSelectedSessionLink();
            if (!link) {
                return false;
            }

            postToHost('open-link:' + JSON.stringify({ href: link }));
            return true;
        }

        function isHeimdallActionEnabled(name) {
            return name === 'open-session' && getSelectedSessionLink() !== null;
        }

        function getHeimdallLabel(item) {
            return heimdallLabels[item.labelKey] || item.fallbackLabel || item.heimdallAction;
        }

        function buildContextMenu() {
            contextMenu.innerHTML = '';

            contextMenuItems.forEach(function(item) {
                if (item.separator) {
                    contextMenu.appendChild(document.createElement('hr'));
                    return;
                }

                var isHeimdall = !!item.heimdallAction;
                var button = document.createElement('button');
                var enabled = isHeimdall
                    ? isHeimdallActionEnabled(item.heimdallAction)
                    : isDrawioActionEnabled(item.action);

                button.disabled = !enabled;

                var label = document.createElement('span');
                label.textContent = isHeimdall
                    ? getHeimdallLabel(item)
                    : getDrawioLabel(item.action, item.labelKey, item.fallbackLabel);
                button.appendChild(label);

                if (item.shortcut) {
                    var shortcut = document.createElement('span');
                    shortcut.className = 'shortcut';
                    shortcut.textContent = item.shortcut;
                    button.appendChild(shortcut);
                }

                button.addEventListener('pointerdown', function(evt) {
                    evt.preventDefault();
                    evt.stopPropagation();

                    if (!enabled) {
                        return;
                    }

                    hideContextMenu();

                    if (isHeimdall) {
                        executeHeimdallAction(item.heimdallAction);
                        return;
                    }

                    focusDrawio();
                    window.setTimeout(function() {
                        executeDrawioAction(item.action, evt);
                    }, 0);
                });

                contextMenu.appendChild(button);
            });
        }

        function showContextMenu(clientX, clientY) {
            buildContextMenu();

            contextMenu.style.display = 'block';

            var menuWidth = contextMenu.offsetWidth;
            var menuHeight = contextMenu.offsetHeight;
            var left = Math.min(clientX, Math.max(8, window.innerWidth - menuWidth - 8));
            var top = Math.min(clientY, Math.max(8, window.innerHeight - menuHeight - 8));

            contextMenu.style.left = Math.max(8, left) + 'px';
            contextMenu.style.top = Math.max(8, top) + 'px';
            frame.style.pointerEvents = 'none';
            contextMenuVisible = true;
        }

        // Selects whatever sits under the pointer, so the menu describes the cell
        // the user aimed at.
        //
        // A right click leaves draw.io's own selection untouched, and this menu is
        // built from the DOM contextmenu event, which arrives before draw.io has
        // decided anything. Read the selection instead and the menu is built
        // against whatever happened to be selected earlier, usually nothing: the
        // session entry was then permanently disabled, which is exactly what the
        // visual pass found.
        function selectCellUnderPointer(clientX, clientY) {
            var app = getDrawioApp();
            if (!app || !app.editor || !app.editor.graph) {
                return null;
            }

            try {
                var graph = app.editor.graph;
                var point = frame.contentWindow.mxUtils.convertPoint(
                    graph.container, clientX, clientY);
                var cell = graph.getCellAt(point.x, point.y);

                if (cell) {
                    graph.setSelectionCell(cell);
                } else {
                    graph.clearSelection();
                }

                return cell;
            } catch (e) {
                return null;
            }
        }

        function onFrameContextMenu(evt) {
            if (!editorReady) {
                return;
            }

            evt.preventDefault();
            evt.stopPropagation();

            selectCellUnderPointer(evt.clientX, evt.clientY);

            var frameRect = frame.getBoundingClientRect();
            showContextMenu(frameRect.left + evt.clientX, frameRect.top + evt.clientY);
        }

        function onFrameKeyDown(evt) {
            if (evt.key === 'Escape') {
                hideContextMenu();
                return;
            }

            if (evt.key !== 'ContextMenu' && !(evt.shiftKey && evt.key === 'F10')) {
                return;
            }

            evt.preventDefault();
            evt.stopPropagation();

            var frameRect = frame.getBoundingClientRect();
            var x = frameRect.left + Math.min(120, Math.max(24, frameRect.width / 4));
            var y = frameRect.top + Math.min(120, Math.max(24, frameRect.height / 4));

            showContextMenu(x, y);
        }

        function ensureContextMenuBinding(attempt) {
            if (contextMenuBound) {
                return true;
            }

            try {
                if (!frame.contentWindow || !frame.contentDocument || !frame.contentDocument.body) {
                    throw new Error('frame not ready');
                }

                frame.contentDocument.addEventListener('contextmenu', onFrameContextMenu, true);
                frame.contentDocument.addEventListener('pointerdown', hideContextMenu, true);
                frame.contentDocument.addEventListener('wheel', hideContextMenu, true);
                frame.contentDocument.addEventListener('keydown', onFrameKeyDown, true);
                frame.contentWindow.addEventListener('blur', hideContextMenu);
                window.addEventListener('blur', hideContextMenu);
                window.addEventListener('resize', hideContextMenu);
                document.addEventListener('pointerdown', function(evt) {
                    if (!contextMenu.contains(evt.target)) {
                        hideContextMenu();
                    }
                }, true);
                contextMenu.addEventListener('contextmenu', function(evt) {
                    evt.preventDefault();
                    evt.stopPropagation();
                }, true);

                contextMenuBound = true;
                return true;
            } catch (e) {
                if ((attempt || 0) < 20) {
                    setTimeout(function() {
                        ensureContextMenuBinding((attempt || 0) + 1);
                    }, 50);
                }
                return false;
            }
        }

        // Listen for messages from the draw.io iframe (embed protocol)
        window.addEventListener('message', function(evt) {
            if (!evt.data || typeof evt.data !== 'string') return;
            // Accept messages from the iframe only
            if (evt.source !== frame.contentWindow) return;
            if (evt.origin !== editorOrigin) return;

            try {
                var msg = JSON.parse(evt.data);
                handleDrawioMessage(msg);
            } catch (e) {
                // Ignore non-protocol messages
            }
        });

        function handleDrawioMessage(msg) {
            switch(msg.event) {
                case 'init':
                    editorReady = true;
                    loadDiagram(currentXml);
                    configureEditorChrome(0);
                    postToHost('editor-ready:');
                    break;

                case 'autosave':
                    // Fired on every change: the host tracks it as the current document.
                    if (typeof msg.xml === 'string') {
                        postToHost('save:' + msg.xml);
                    }
                    break;

                case 'save':
                    // Fired by Ctrl+S inside the editor: the user asked for a write to disk.
                    if (typeof msg.xml === 'string') {
                        postToHost('save-request:' + msg.xml);
                    }
                    break;

                case 'export':
                    if (msg.format === 'xml' && typeof msg.xml === 'string') {
                        postToHost('export-xml:' + msg.xml);
                    } else if (typeof msg.data === 'string') {
                        postToHost('export:' + msg.data);
                    }
                    break;

                case 'exit':
                    postToHost('exit:');
                    break;

                case 'openLink':
                    if (msg.href) {
                        postToHost('open-link:' + JSON.stringify({ href: msg.href }));
                    }
                    break;
            }
        }

        // Listen for messages from the C# host
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function(evt) {
                var msg = evt.data;
                if (typeof msg !== 'string') return;

                if (msg.indexOf('load:') === 0) {
                    currentXml = msg.substring('load:'.length);
                    if (editorReady) {
                        loadDiagram(currentXml);
                    }
                    return;
                }

                if (msg === 'export-png:') {
                    postToEditor({ action: 'export', format: 'png', spinKey: 'export' });
                    return;
                }

                if (msg === 'export-svg:') {
                    postToEditor({ action: 'export', format: 'svg', spinKey: 'export' });
                    return;
                }

                if (msg === 'export-xml:') {
                    postToEditor({ action: 'export', format: 'xml' });
                    return;
                }

                if (msg.indexOf('labels:') === 0) {
                    // Labels for the entries Heimdall adds to the context menu.
                    try {
                        heimdallLabels = JSON.parse(msg.substring('labels:'.length)) || {};
                    } catch (e) {
                        heimdallLabels = {};
                    }
                    return;
                }

                if (msg.indexOf('command:') === 0) {
                    executeDrawioAction(msg.substring('command:'.length));
                    return;
                }
            });

            postToHost('ready:');
        }

        // Hide draw.io's native menu bar and toolbar after the iframe loads,
        // because Heimdall provides the command surface in WPF instead.
        //
        // This used to be justified by draw.io's menus not dispatching inside a
        // WebView2 iframe. Measured on the vendored 31.4.5 and false: its own
        // context menu opens, is localized and works. It is disabled explicitly
        // above, in configureEditorChrome, precisely because it worked well
        // enough to open over Heimdall's and swallow the click meant for it.
        // Hiding the chrome is a product decision about one command surface, not
        // a workaround for a broken one.
        frame.onload = function() {
            try {
                var style = frame.contentDocument.createElement('style');
                style.textContent =
                    '.geMenubarContainer, .geEditor > .geToolbarContainer { display: none !important; }';
                frame.contentDocument.head.appendChild(style);
            } catch(e) {}

            ensureContextMenuBinding(0);
        };

        // Load draw.io in embed mode inside the iframe.
        // embed=1 & proto=json: the postMessage protocol used above
        // offline=1 & stealth=1: no online feature, no outbound request
        // noSaveBtn=1 & noExitBtn=1 & saveAndExit=0: no embed-mode buttons or prompts
        // lang / ui / dark: follow Heimdall's locale and theme
        var editorParams = new URLSearchParams({
            embed: '1',
            proto: 'json',
            spin: '1',
            libraries: '1',
            offline: '1',
            stealth: '1',
            noSaveBtn: '1',
            noExitBtn: '1',
            saveAndExit: '0',
            lang: editorLanguage,
            ui: editorTheme === 'light' ? 'kennedy' : 'dark',
            dark: editorTheme === 'light' ? '0' : '1'
        });
        frame.src = 'index.html?' + editorParams.toString();
    </script>
</body>
</html>
